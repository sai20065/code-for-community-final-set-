# App icon config for `dart run flutter_launcher_icons`.
#
# Deliberately ONE file with the default name. flutter_launcher_icons treats
# any `flutter_launcher_icons-<name>.yaml` as a build *flavor*: the old
# `flutter_launcher_icons-android.yaml` / `-web.yaml` pair made it write the
# logo into android/app/src/android/res (an "android" flavor that doesn't
# exist), so every APK shipped with the default Flutter icon.
flutter_launcher_icons:
  image_path: "assets/icon/logo.png"
  android: true
  ios: false
  min_sdk_android: 21
  # Android 8.0+ prefers the adaptive-icon descriptor over the legacy PNGs.
  # The full logo: the generator itself insets the foreground by 16%, which
  # puts the round logo inside the adaptive-icon safe zone.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/logo.png"
  web:
    generate: true
    image_path: "assets/icon/logo.png"
    background_color: "#F3F2EE"
    theme_color: "#2E1F8F"
